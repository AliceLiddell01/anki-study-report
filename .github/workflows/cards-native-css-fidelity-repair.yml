name: Apply Cards native CSS fidelity repair

on:
  pull_request:
    branches:
      - core
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'c2-manual-acceptance-remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: c2-manual-acceptance-remediation
          fetch-depth: 0

      - name: Apply verified native CSS fidelity patch
        shell: bash
        run: |
          set -euo pipefail
          cat .stage2-native-css/chunk-* | base64 --decode > /tmp/cards-native-css.patch.zst
          echo '2c2d6ae8e7cd8f2c9598fd3605573ac90f7e46a27f54af158fb7ede927cea703  /tmp/cards-native-css.patch.zst' | sha256sum --check --strict
          zstd --decompress --stdout /tmp/cards-native-css.patch.zst > /tmp/cards-native-css.patch
          echo '9f9949dfa272a43f53ef669f0d1facf309354286f82cc085359858765636bef9  /tmp/cards-native-css.patch' | sha256sum --check --strict
          git apply --index --whitespace=error /tmp/cards-native-css.patch
          git rm -r .stage2-native-css .stage2-native-css-patch.b64 .github/workflows/cards-native-css-fidelity-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore exact native Anki stylesheet fidelity'
          git push origin HEAD:c2-manual-acceptance-remediation
