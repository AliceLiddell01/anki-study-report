name: Apply native Anki night-mode correction

on:
  pull_request:
    branches:
      - core
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'c2-manual-acceptance-remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: c2-manual-acceptance-remediation
          fetch-depth: 0

      - name: Apply verified correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat .nightmode-correction-patch/chunk-* | base64 --decode > /tmp/nightmode.patch.zst
          echo 'b8bb9c6060589b894428814d4bd635ba89278f948653a4ed85f0832452b86061  /tmp/nightmode.patch.zst' | sha256sum --check --strict
          zstd --decompress --stdout /tmp/nightmode.patch.zst > /tmp/nightmode.patch
          echo '7991119d1cbec638b1462a018c99ead2090feb1dfe2f8cf585eea2153597c082  /tmp/nightmode.patch' | sha256sum --check --strict
          git apply --index --whitespace=error /tmp/nightmode.patch
          git rm -r .nightmode-correction-patch .github/workflows/nightmode-correction-apply.yml
          git commit -m 'Restore native Anki night-mode fidelity in Cards previews'
          git push origin HEAD:c2-manual-acceptance-remediation
