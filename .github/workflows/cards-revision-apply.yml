name: Apply bounded Cards visual revision

on:
  push:
    branches:
      - c2-manual-acceptance-remediation

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Stage the bounded Cards visual revision')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Apply verified Cards revision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat .cards-revision-patch/part-* | base64 --decode > /tmp/cards-revision.patch.zst
          echo "5ffd208f9bc1d889215e5cead154ae737f252fa589cf0fc6defb4c9588089e1b  /tmp/cards-revision.patch.zst" | sha256sum --check --strict
          zstd --decompress --stdout /tmp/cards-revision.patch.zst > /tmp/cards-revision.patch
          echo "87cf388cef187538452046480b5bd81547d4da784087eee4e65a9a2671af2493  /tmp/cards-revision.patch" | sha256sum --check --strict
          git apply --index --whitespace=error /tmp/cards-revision.patch
          git rm -r .cards-revision-patch .github/workflows/cards-revision-apply.yml
          git commit -m "Align the Cards workspace with the accepted visual reference"
          git push origin HEAD:c2-manual-acceptance-remediation
