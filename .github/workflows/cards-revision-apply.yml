name: Apply verified Cards visual revision

on:
  push:
    branches:
      - c2-manual-acceptance-remediation

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'ENABLE_AFTER_CHUNKS')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Apply verified Cards revision
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat .cards-revision-patch/chunk-* | base64 --decode > /tmp/cards-revision.patch.zst
          echo "69c27de86a671a14056962f63ec8292589569d57c69a8fe21a39dd107b2800e7  /tmp/cards-revision.patch.zst" | sha256sum --check --strict
          zstd --decompress --stdout /tmp/cards-revision.patch.zst > /tmp/cards-revision.patch
          echo "c0c3e982dc8b9390492c9f1f6582931334d93111f72d278219f6d0272d580f4f  /tmp/cards-revision.patch" | sha256sum --check --strict
          git apply --index --whitespace=error /tmp/cards-revision.patch
          git rm -r .cards-revision-patch .github/workflows/cards-revision-apply.yml
          git commit -m "Align the Cards workspace with the accepted visual reference"
          git push origin HEAD:c2-manual-acceptance-remediation
