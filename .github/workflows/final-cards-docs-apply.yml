name: Apply final Cards visual closure documentation

on:
  pull_request:
    branches:
      - core
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'c2-manual-acceptance-remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: c2-manual-acceptance-remediation
          fetch-depth: 0

      - name: Apply verified documentation patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat .final-cards-docs-patch/chunk-* | base64 --decode > /tmp/final-cards-docs.patch.zst
          echo '450d2de14c2a20a8418ed8c8317db3dda534225feab7290041d5a42037b732f3  /tmp/final-cards-docs.patch.zst' | sha256sum --check --strict
          zstd --decompress --stdout /tmp/final-cards-docs.patch.zst > /tmp/final-cards-docs.patch
          echo '1cc64e0f34de1367df4a36b2edf0cbc989296e468dcad97017ecb6e072d8ea77  /tmp/final-cards-docs.patch' | sha256sum --check --strict
          git apply --index --whitespace=error /tmp/final-cards-docs.patch
          git rm -r .final-cards-docs-patch .github/workflows/final-cards-docs-apply.yml
          git commit -m 'Document the final Cards visual closure evidence'
          git push origin HEAD:c2-manual-acceptance-remediation
