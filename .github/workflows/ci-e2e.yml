name: Full Docker / Anki E2E

on:
  workflow_call:
    inputs:
      mode:
        required: false
        default: standard
        type: string
      scope:
        required: false
        default: full
        type: string
      screenshot_workers:
        required: false
        default: auto
        type: string
      resource_telemetry:
        required: false
        default: true
        type: boolean
      verify_restart:
        required: false
        default: auto
        type: string
      run_purpose:
        required: false
        default: acceptance
        type: string
      release_artifact_name:
        required: false
        default: ""
        type: string
      release_artifact_sha256:
        required: false
        default: ""
        type: string
      fast_ci_run_id:
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      mode:
        description: E2E mode
        required: true
        default: standard
        type: choice
        options:
          - standard
          - strict-apkg
          - perf100
      scope:
        description: Product scope (targeted scopes are development gates)
        required: true
        default: full
        type: choice
        options:
          - full
          - global
          - stats
          - decks
          - activity
          - cards
          - settings
          - notifications
      screenshot_workers:
        description: Bounded BrowserContext workers
        required: true
        default: auto
        type: choice
        options: [auto, "1", "2", "3", "4"]
      resource_telemetry:
        description: Sample container resources
        required: true
        default: true
        type: boolean
      verify_restart:
        description: Restart policy (auto means full only)
        required: true
        default: auto
        type: choice
        options: [auto, "true", "false"]
      run_purpose:
        description: Bounded purpose for reliability statistics
        required: true
        default: acceptance
        type: choice
        options:
          - acceptance
          - controlled
          - measurement
      fast_ci_run_id:
        description: Exact successful Fast CI run ID for this branch commit
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: ci-e2e-${{ github.ref }}-${{ inputs.mode || 'standard' }}-${{ inputs.scope || 'stats' }}-${{ inputs.screenshot_workers || '3' }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Real Anki Desktop (${{ inputs.mode || 'standard' }} / ${{ inputs.scope || 'stats' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      E2E_MODE: ${{ inputs.mode || 'standard' }}
      E2E_SCOPE: ${{ inputs.scope || 'stats' }}
      SCREENSHOT_WORKERS_INPUT: ${{ inputs.screenshot_workers || '3' }}
      RESOURCE_TELEMETRY_INPUT: ${{ inputs.resource_telemetry && 'true' || 'false' }}
      VERIFY_RESTART_INPUT: ${{ inputs.verify_restart || 'auto' }}
      E2E_RUN_PURPOSE_INPUT: ${{ inputs.run_purpose || 'acceptance' }}
      RELEASE_ARTIFACT_NAME_INPUT: ${{ inputs.release_artifact_name || '' }}
      RELEASE_ARTIFACT_SHA256_INPUT: ${{ inputs.release_artifact_sha256 || '' }}
      FAST_CI_RUN_ID_INPUT: ${{ inputs.fast_ci_run_id || '' }}
      ANKI_VERSION: "26.05"
      # Official GitHub release asset digest for anki-26.05-linux-x86_64.tar.zst.
      ANKI_SHA256: 6223d705563f71ab40ce072a5d96a3919c546d5dde1e4c49dc27975e70067274
      ANKI_REQUIRE_SHA256: "1"
      COMPOSE_PROJECT_NAME: asr-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      ANKI_E2E_ARTIFACT_ROOT: e2e-artifacts
      ANKI_E2E_HOST_PACKAGE_PATH: docker/anki-e2e/local-input/anki_study_report.ankiaddon

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Capture workflow source and validate package source inputs
        id: source_mode
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ci-e2e-raw | Out-Null
          New-Item -ItemType Directory -Force e2e-artifacts/reports | Out-Null
          Remove-Item -LiteralPath e2e-artifacts/reports/non-release-build-identity.json -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath e2e-artifacts/reports/release-build-identity.json -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath ci-e2e-raw/non-release-build-identity.json -Force -ErrorAction SilentlyContinue
          $workers = if ($env:SCREENSHOT_WORKERS_INPUT -eq 'auto') { '3' } else { $env:SCREENSHOT_WORKERS_INPUT }
          $telemetry = if ($env:RESOURCE_TELEMETRY_INPUT -eq 'false') { '0' } else { '1' }
          $purpose = if ($env:E2E_MODE -eq 'perf100') { 'measurement' } else { $env:E2E_RUN_PURPOSE_INPUT }
          if ($purpose -notin @('acceptance', 'controlled', 'measurement')) { $purpose = 'acceptance' }
          $started = [DateTime]::UtcNow.ToString('o')
          "CI_E2E_STARTED_AT=$started" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CI_E2E_PWSH_VERSION=$($PSVersionTable.PSVersion)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CI_E2E_EXIT_CODE=1" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CI_E2E_ARTIFACT_EXIT_CODE=1" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_PACKAGE_SOURCE=unresolved" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_SCOPE=$env:E2E_SCOPE" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_SCREENSHOT_WORKERS=$workers" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_RESOURCE_TELEMETRY=$telemetry" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "E2E_RUN_PURPOSE=$purpose" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "E2E_FINAL_CLEANUP_STATUS=unknown" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "E2E_FINAL_CLEANUP_DURATION_MS=" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "E2E_ARTIFACT_PREPARATION_DURATION_MS=" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "E2E_ARTIFACT_UPLOAD_DURATION_MS=" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_BUILD_DURATION_MS=0" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_IMAGE_SIZE_BYTES=0" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_CACHE_STATE=unavailable" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_IMAGE_SOURCE=ghcr" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_IMAGE_REFERENCE=" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_IMAGE_DIGEST=" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_IMAGE_PLATFORM=linux/amd64" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_IMAGE_PREPARATION_DURATION_MS=0" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_ENVIRONMENT_CONTRACT_SHA256=" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_ENVIRONMENT_PUBLICATION_RUN_ID=" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_ENVIRONMENT_REUSE_VERIFICATION_RUN_ID=" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "E2E_WORKFLOW_SOURCE_SHA=${{ job.workflow_sha }}" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "E2E_WORKFLOW_SOURCE_REPOSITORY=${{ job.workflow_repository }}" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "E2E_WORKFLOW_SOURCE_PATH=${{ job.workflow_file_path }}" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "E2E_WORKFLOW_SOURCE_REF=${{ job.workflow_ref }}" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "E2E_CHECKOUT_SHA=${{ job.workflow_sha }}" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $initialCheckout = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $initialCheckout -notmatch '^[0-9a-f]{40}$') {
            throw 'Could not resolve the initial E2E checkout SHA.'
          }
          "E2E_CHECKOUT_SHA=$initialCheckout" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          python scripts/verify_fast_ci_e2e_handoff.py validate-inputs `
            --release-artifact-name "$env:RELEASE_ARTIFACT_NAME_INPUT" `
            --release-artifact-sha256 "$env:RELEASE_ARTIFACT_SHA256_INPUT" `
            --fast-ci-run-id "$env:FAST_CI_RUN_ID_INPUT" `
            --output "$env:RUNNER_TEMP/package-source.json" `
            --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'Invalid E2E package source inputs.' }
          $source = Get-Content "$env:RUNNER_TEMP/package-source.json" -Raw | ConvertFrom-Json
          "ANKI_E2E_PACKAGE_SOURCE=$($source.packageSource)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          if ($source.packageSource -eq 'source-build') {
            throw 'Cloud E2E requires an exact prebuilt Fast CI or release artifact package.'
          }
          if ($source.packageSource -notin @('fast-ci-artifact', 'release-artifact')) {
            throw "Unsupported cloud package source: $($source.packageSource)"
          }

      - name: Resolve exact successful Fast CI run and artifact IDs
        id: resolve_fast_ci
        if: steps.source_mode.outputs.package_source == 'fast-ci-artifact'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runJson = Join-Path $env:RUNNER_TEMP 'fast-ci-run.json'
          $artifactsJson = Join-Path $env:RUNNER_TEMP 'fast-ci-artifacts.json'
          gh api "repos/${{ github.repository }}/actions/runs/$env:FAST_CI_RUN_ID_INPUT" | Set-Content -LiteralPath $runJson -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the requested Fast CI run.' }
          gh api "repos/${{ github.repository }}/actions/runs/$env:FAST_CI_RUN_ID_INPUT/artifacts?per_page=100" | Set-Content -LiteralPath $artifactsJson -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve artifacts for the requested Fast CI run.' }
          python scripts/verify_fast_ci_e2e_handoff.py resolve-run `
            --run-json $runJson `
            --artifacts-json $artifactsJson `
            --repository '${{ github.repository }}' `
            --run-id $env:FAST_CI_RUN_ID_INPUT `
            --output "$env:RUNNER_TEMP/fast-ci-resolution.json" `
            --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'Fast CI source-run resolution failed.' }

      - name: Download exact Fast CI diagnostics by artifact ID
        if: steps.source_mode.outputs.package_source == 'fast-ci-artifact'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.resolve_fast_ci.outputs.diagnostics_artifact_id }}
          path: ${{ runner.temp }}/fast-ci-diagnostics
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve_fast_ci.outputs.source_run_id }}
          merge-multiple: true
          digest-mismatch: error

      - name: Validate Fast CI diagnostics and derive tested commit
        id: fast_diagnostics
        if: steps.source_mode.outputs.package_source == 'fast-ci-artifact'
        shell: pwsh
        run: |
          python scripts/verify_fast_ci_e2e_handoff.py validate-diagnostics `
            --resolution "$env:RUNNER_TEMP/fast-ci-resolution.json" `
            --directory "$env:RUNNER_TEMP/fast-ci-diagnostics" `
            --output "$env:RUNNER_TEMP/fast-ci-diagnostics-validated.json" `
            --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'Fast CI diagnostics validation failed.' }

      - name: Check out exact E2E workflow and harness commit
        if: steps.source_mode.outputs.package_source == 'fast-ci-artifact'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact E2E harness checkout
        if: steps.source_mode.outputs.package_source == 'fast-ci-artifact'
        shell: pwsh
        env:
          EXPECTED_HARNESS_SHA: ${{ job.workflow_sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_HARNESS_SHA) {
            throw "Exact E2E harness checkout mismatch: $actual"
          }
          "E2E_CHECKOUT_SHA=$actual" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download exact Fast CI package by artifact ID
        if: steps.source_mode.outputs.package_source == 'fast-ci-artifact'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.resolve_fast_ci.outputs.package_artifact_id }}
          path: ${{ runner.temp }}/fast-ci-package
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve_fast_ci.outputs.source_run_id }}
          merge-multiple: true
          digest-mismatch: error
      - name: Validate and stage exact Fast CI package
        id: fast_package
        if: steps.source_mode.outputs.package_source == 'fast-ci-artifact'
        shell: pwsh
        run: |
          python scripts/write_ci_package_metadata.py --verify-only --output-directory "$env:RUNNER_TEMP/fast-ci-package"
          if ($LASTEXITCODE -ne 0) { throw 'Stage 2 package metadata validation failed.' }
          $checkoutSha = (git rev-parse HEAD).Trim().ToLowerInvariant()
          python scripts/verify_fast_ci_e2e_handoff.py validate-package `
            --resolution "$env:RUNNER_TEMP/fast-ci-resolution.json" `
            --diagnostics "$env:RUNNER_TEMP/fast-ci-diagnostics-validated.json" `
            --directory "$env:RUNNER_TEMP/fast-ci-package" `
            --e2e-workflow-source-sha $env:E2E_WORKFLOW_SOURCE_SHA `
            --e2e-checkout-sha $checkoutSha `
            --output "$env:RUNNER_TEMP/fast-ci-handoff.json" `
            --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'Cross-run Fast CI package validation failed.' }
          $source = Join-Path $env:RUNNER_TEMP 'fast-ci-package/anki_study_report.ankiaddon'
          New-Item -ItemType Directory -Force docker/anki-e2e/local-input | Out-Null
          Copy-Item -LiteralPath $source -Destination docker/anki-e2e/local-input/anki_study_report.ankiaddon -Force
          'ANKI_E2E_PREBUILT_ADDON_PATH=/e2e/local-input/anki_study_report.ankiaddon' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'ANKI_E2E_PACKAGE_SOURCE=fast-ci-artifact' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $handoff = Get-Content "$env:RUNNER_TEMP/fast-ci-handoff.json" -Raw | ConvertFrom-Json
          "ANKI_E2E_FAST_CI_RUN_ID=$env:FAST_CI_RUN_ID_INPUT" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_FAST_CI_TESTED_SHA=$($handoff.sourceTestedCommitSha)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_FAST_CI_PACKAGE_SHA256=$($handoff.packageSha256)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download exact release artifact
        if: steps.source_mode.outputs.package_source == 'release-artifact'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.release_artifact_name }}
          path: release-e2e-input

      - name: Stage and verify exact release artifact
        if: steps.source_mode.outputs.package_source == 'release-artifact'
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ inputs.release_artifact_sha256 }}
        run: |
          if (-not $env:EXPECTED_SHA256 -or $env:EXPECTED_SHA256 -notmatch '^[0-9a-f]{64}$') {
            throw 'A valid release_artifact_sha256 is required with release_artifact_name.'
          }
          $source = 'release-e2e-input/anki_study_report.ankiaddon'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw 'The internal release artifact does not contain anki_study_report.ankiaddon.'
          }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $source).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256) {
            throw "Exact release artifact SHA-256 mismatch: $actual"
          }
          New-Item -ItemType Directory -Force docker/anki-e2e/local-input | Out-Null
          Copy-Item -LiteralPath $source -Destination docker/anki-e2e/local-input/anki_study_report.ankiaddon -Force
          'ANKI_E2E_PREBUILT_ADDON_PATH=/e2e/local-input/anki_study_report.ankiaddon' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          'ANKI_E2E_PACKAGE_SOURCE=release-artifact' | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          New-Item -ItemType Directory -Force e2e-artifacts/reports | Out-Null
          [ordered]@{
            schemaVersion = 1
            kind = 'release-artifact'
            identityDigest = "sha256:$actual"
            artifactName = $env:RELEASE_ARTIFACT_NAME_INPUT
          } | ConvertTo-Json -Depth 4 | Set-Content e2e-artifacts/reports/release-build-identity.json -Encoding utf8NoBOM

      - name: Capture runner context
        shell: pwsh
        run: |
          @(
            "runnerOs=$env:RUNNER_OS"
            "runnerArch=$env:RUNNER_ARCH"
            "imageOs=$env:ImageOS"
            "imageVersion=$env:ImageVersion"
            "workflowSourceSha=$env:E2E_WORKFLOW_SOURCE_SHA"
            "workflowSourceRepository=$env:E2E_WORKFLOW_SOURCE_REPOSITORY"
            "workflowSourcePath=$env:E2E_WORKFLOW_SOURCE_PATH"
            "e2eCheckoutSha=$env:E2E_CHECKOUT_SHA"
            "packageSource=$env:ANKI_E2E_PACKAGE_SOURCE"
            "imageSource=$env:ANKI_E2E_IMAGE_SOURCE"
            "runId=$env:GITHUB_RUN_ID"
            "runAttempt=$env:GITHUB_RUN_ATTEMPT"
            "composeProject=$env:COMPOSE_PROJECT_NAME"
            "mode=$env:E2E_MODE"
            "scope=$env:E2E_SCOPE"
            "powershellVersion=$($PSVersionTable.PSVersion)"
            "--- cpu ---"
          ) | Tee-Object -FilePath ci-e2e-raw/docker-system.txt
          nproc | Tee-Object -FilePath ci-e2e-raw/docker-system.txt -Append
          "--- memory ---" | Tee-Object -FilePath ci-e2e-raw/docker-system.txt -Append
          free -h | Tee-Object -FilePath ci-e2e-raw/docker-system.txt -Append
          "--- disk before ---" | Tee-Object -FilePath ci-e2e-raw/docker-system.txt -Append
          df -h | Tee-Object -FilePath ci-e2e-raw/docker-system.txt -Append

      - name: Normalize E2E runtime inputs
        shell: pwsh
        run: |
          $workers = if ($env:SCREENSHOT_WORKERS_INPUT -eq 'auto') { '3' } else { $env:SCREENSHOT_WORKERS_INPUT }
          $telemetry = if ($env:RESOURCE_TELEMETRY_INPUT -eq 'false') { '0' } else { '1' }
          $restart = switch ($env:VERIFY_RESTART_INPUT) { 'true' { '1' }; 'false' { '0' }; default { $env:VERIFY_RESTART_INPUT } }
          $purpose = if ($env:E2E_MODE -eq 'perf100') { 'measurement' } else { $env:E2E_RUN_PURPOSE_INPUT }
          if ($purpose -notin @('acceptance', 'controlled', 'measurement')) {
            throw "Unsupported E2E run purpose: $purpose"
          }
          "E2E_RUN_PURPOSE=$purpose" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_SCOPE=$env:E2E_SCOPE" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_SCREENSHOT_WORKERS=$workers" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_RESOURCE_TELEMETRY=$telemetry" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_VERIFY_RESTART=$restart" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_NO_BUILD=1" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_CACHE_BACKEND=ghcr-digest" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run canonical static E2E preflight
        id: static_preflight
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force e2e-artifacts/reports | Out-Null
          python scripts/e2e_preflight.py run `
            --repo-root . `
            --output e2e-artifacts/reports/preflight-report.json `
            --layer static `
            --execution-context github-actions
          if ($LASTEXITCODE -ne 0) { throw 'Static Docker E2E preflight failed.' }

      - name: Validate environment consumer lock
        id: environment_lock
        shell: pwsh
        run: |
          python scripts/validate_e2e_environment_consumer.py validate-consumer-lock `
            --spec docker/anki-e2e/environment-image-spec.json `
            --lock docker/anki-e2e/environment-image-lock.json `
            --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'Environment consumer lock validation failed.' }

      - name: Expose exact GHCR environment identity
        shell: pwsh
        env:
          EXACT_REFERENCE: ${{ steps.environment_lock.outputs.image_reference }}
          EXPECTED_DIGEST: ${{ steps.environment_lock.outputs.image_digest }}
          EXPECTED_PLATFORM: ${{ steps.environment_lock.outputs.image_platform }}
          EXPECTED_CONTRACT: ${{ steps.environment_lock.outputs.environment_contract_sha256 }}
          PUBLICATION_RUN_ID: ${{ steps.environment_lock.outputs.environment_publication_run_id }}
          REUSE_RUN_ID: ${{ steps.environment_lock.outputs.environment_reuse_verification_run_id }}
        run: |
          "ANKI_E2E_IMAGE=$env:EXACT_REFERENCE" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_IMAGE_REFERENCE=$env:EXACT_REFERENCE" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_IMAGE_DIGEST=$env:EXPECTED_DIGEST" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_IMAGE_PLATFORM=$env:EXPECTED_PLATFORM" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_ENVIRONMENT_CONTRACT_SHA256=$env:EXPECTED_CONTRACT" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_ENVIRONMENT_PUBLICATION_RUN_ID=$env:PUBLICATION_RUN_ID" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_ENVIRONMENT_REUSE_VERIFICATION_RUN_ID=$env:REUSE_RUN_ID" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run canonical runtime E2E preflight
        id: runtime_preflight
        shell: pwsh
        run: |
          python scripts/e2e_preflight.py run `
            --repo-root . `
            --output e2e-artifacts/reports/preflight-report.json `
            --layer runtime `
            --execution-context github-actions
          if ($LASTEXITCODE -ne 0) { throw 'Runtime Docker E2E preflight failed.' }
          "ANKI_E2E_PREFLIGHT_COMPLETE=1" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull and verify exact GHCR environment image
        shell: pwsh
        env:
          EXACT_REFERENCE: ${{ steps.environment_lock.outputs.image_reference }}
          EXPECTED_DIGEST: ${{ steps.environment_lock.outputs.image_digest }}
          EXPECTED_PLATFORM: ${{ steps.environment_lock.outputs.image_platform }}
          EXPECTED_VERSION: ${{ steps.environment_lock.outputs.environment_version }}
          EXPECTED_CONTRACT: ${{ steps.environment_lock.outputs.environment_contract_sha256 }}
          EXPECTED_REVISION: ${{ steps.environment_lock.outputs.published_from_commit_sha }}
          PUBLICATION_RUN_ID: ${{ steps.environment_lock.outputs.environment_publication_run_id }}
          REUSE_RUN_ID: ${{ steps.environment_lock.outputs.environment_reuse_verification_run_id }}
        run: |
          $started = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          docker pull --platform $env:EXPECTED_PLATFORM $env:EXACT_REFERENCE
          if ($LASTEXITCODE -ne 0) { throw 'Exact GHCR environment image pull failed.' }
          $repoDigests = docker image inspect $env:EXACT_REFERENCE --format '{{json .RepoDigests}}' | ConvertFrom-Json
          if ($env:EXACT_REFERENCE -notin @($repoDigests)) {
            throw "Pulled image RepoDigests do not contain the exact reference: $env:EXACT_REFERENCE"
          }
          $platform = docker image inspect $env:EXACT_REFERENCE --format '{{.Os}}/{{.Architecture}}'
          if ($platform -ne $env:EXPECTED_PLATFORM) { throw "Environment image platform mismatch: $platform" }
          $source = docker image inspect $env:EXACT_REFERENCE --format '{{index .Config.Labels "org.opencontainers.image.source"}}'
          $version = docker image inspect $env:EXACT_REFERENCE --format '{{index .Config.Labels "org.opencontainers.image.version"}}'
          $contract = docker image inspect $env:EXACT_REFERENCE --format '{{index .Config.Labels "io.github.anki-study-report.e2e.environment-contract"}}'
          $revision = docker image inspect $env:EXACT_REFERENCE --format '{{index .Config.Labels "org.opencontainers.image.revision"}}'
          if ($source -ne 'https://github.com/AliceLiddell01/anki-study-report') { throw "Environment image source label mismatch: $source" }
          if ($version -ne $env:EXPECTED_VERSION) { throw "Environment image version label mismatch: $version" }
          if ($contract -ne $env:EXPECTED_CONTRACT) { throw "Environment image contract label mismatch: $contract" }
          if ($revision -and $revision -ne $env:EXPECTED_REVISION) { throw "Environment image revision label mismatch: $revision" }
          $size = docker image inspect $env:EXACT_REFERENCE --format '{{.Size}}'
          $duration = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() - $started
          "ANKI_E2E_IMAGE_PLATFORM=$platform" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_IMAGE_PREPARATION_DURATION_MS=$duration" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_IMAGE_SIZE_BYTES=$size" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ANKI_E2E_CACHE_STATE=ghcr-digest" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build canonical non-release build identity
        if: steps.source_mode.outputs.package_source == 'fast-ci-artifact'
        shell: pwsh
        run: |
          $identityPath = 'ci-e2e-raw/non-release-build-identity.json'
          python scripts/non_release_build_identity.py build `
            --handoff "$env:RUNNER_TEMP/fast-ci-handoff.json" `
            --reuse ci-e2e-raw/e2e-harness-reuse.json `
            --environment-lock docker/anki-e2e/environment-image-lock.json `
            --package docker/anki-e2e/local-input/anki_study_report.ankiaddon `
            --repository '${{ github.repository }}' `
            --harness-sha $env:E2E_CHECKOUT_SHA `
            --checkout-sha $env:E2E_CHECKOUT_SHA `
            --workflow-repository $env:E2E_WORKFLOW_SOURCE_REPOSITORY `
            --workflow-path $env:E2E_WORKFLOW_SOURCE_PATH `
            --workflow-source-sha $env:E2E_WORKFLOW_SOURCE_SHA `
            --image-reference $env:ANKI_E2E_IMAGE_REFERENCE `
            --image-digest $env:ANKI_E2E_IMAGE_DIGEST `
            --image-platform $env:ANKI_E2E_IMAGE_PLATFORM `
            --run-id $env:GITHUB_RUN_ID `
            --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --trigger-sha $env:GITHUB_SHA `
            --ref $env:GITHUB_REF `
            --output $identityPath
          if ($LASTEXITCODE -ne 0) { throw 'Canonical non-release build identity generation failed.' }
          python scripts/non_release_build_identity.py validate-cross-evidence `
            --input $identityPath `
            --handoff "$env:RUNNER_TEMP/fast-ci-handoff.json" `
            --reuse ci-e2e-raw/e2e-harness-reuse.json `
            --environment-lock docker/anki-e2e/environment-image-lock.json `
            --package docker/anki-e2e/local-input/anki_study_report.ankiaddon
          if ($LASTEXITCODE -ne 0) { throw 'Canonical non-release build identity validation failed.' }
          python scripts/non_release_build_identity.py render-summary `
            --input $identityPath `
            --output $env:GITHUB_STEP_SUMMARY
          if ($LASTEXITCODE -ne 0) { throw 'Canonical non-release build identity summary failed.' }
          Copy-Item -LiteralPath $identityPath -Destination e2e-artifacts/reports/non-release-build-identity.json -Force

      - name: Run canonical Docker-only E2E
        id: canonical_e2e
        shell: pwsh
        run: |
          $modeParameters = switch ($env:E2E_MODE) {
            'standard' { @{ DockerOnly = $true } }
            'strict-apkg' { @{ DockerOnly = $true; RequireApkgFixture = $true } }
            'perf100' { @{ DockerOnly = $true; RequireApkgFixture = $true; Perf100 = $true } }
            default { throw "Unsupported E2E mode: $env:E2E_MODE" }
          }
          $exitCode = 0
          try {
            & .\scripts\run_full_check.ps1 @modeParameters -E2EScope $env:ANKI_E2E_SCOPE -ScreenshotWorkers $env:ANKI_E2E_SCREENSHOT_WORKERS -NoDockerBuild *>&1 |
              Tee-Object -FilePath ci-e2e-raw/e2e-run.log
            $exitCode = [int]$LASTEXITCODE
            if ($exitCode -ne 0) { throw "Canonical E2E exited with $exitCode" }
          } catch {
            $_ | Out-String | Tee-Object -FilePath ci-e2e-raw/e2e-run.log -Append
            if ($exitCode -eq 0) { $exitCode = 1 }
          }
          "CI_E2E_EXIT_CODE=$exitCode" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          if ($exitCode -in @(130, 143)) { exit $exitCode }

      - name: Restore canonical non-release build identity evidence
        if: ${{ !cancelled() && steps.source_mode.outputs.package_source == 'fast-ci-artifact' }}
        shell: pwsh
        run: |
          $staged = 'ci-e2e-raw/non-release-build-identity.json'
          $canonical = 'e2e-artifacts/reports/non-release-build-identity.json'
          if (-not (Test-Path -LiteralPath $staged -PathType Leaf)) {
            throw 'Staged canonical non-release build identity is missing.'
          }
          New-Item -ItemType Directory -Force e2e-artifacts/reports | Out-Null
          Copy-Item -LiteralPath $staged -Destination $canonical -Force
          python scripts/non_release_build_identity.py validate --input $canonical
          if ($LASTEXITCODE -ne 0) { throw 'Restored non-release build identity is invalid.' }
          $manifestStatus = if ([int]$env:CI_E2E_EXIT_CODE -eq 0) { 'success' } else { 'failed' }
          python docker/anki-e2e/write-artifact-manifest.py `
            --root e2e-artifacts `
            --status $manifestStatus `
            --anki-version $env:ANKI_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Identity-aware artifact manifest regeneration failed.' }

      - name: Verify tested release artifact hash
        if: ${{ !cancelled() && steps.source_mode.outputs.package_source == 'release-artifact' }}
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ inputs.release_artifact_sha256 }}
        run: |
          $tested = 'e2e-artifacts/package/anki_study_report.ankiaddon'
          if (-not (Test-Path -LiteralPath $tested -PathType Leaf)) {
            throw 'The E2E package evidence is missing.'
          }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $tested).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256) {
            throw "The package tested by real Anki is not the exact release artifact: $actual"
          }

      - name: Verify tested Fast CI package hash
        if: ${{ !cancelled() && steps.source_mode.outputs.package_source == 'fast-ci-artifact' }}
        shell: pwsh
        env:
          EXPECTED_SHA256: ${{ steps.fast_package.outputs.package_sha256 }}
        run: |
          $tested = 'e2e-artifacts/package/anki_study_report.ankiaddon'
          if (-not (Test-Path -LiteralPath $tested -PathType Leaf)) {
            throw 'The E2E package evidence is missing.'
          }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $tested).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256) {
            throw "The package tested by real Anki is not the exact Fast CI artifact: $actual"
          }
      - name: Publish sanitized Fast CI handoff evidence
        if: ${{ !cancelled() && steps.source_mode.outputs.package_source == 'fast-ci-artifact' && steps.fast_package.outcome == 'success' }}
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP 'fast-ci-handoff.json'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw 'Validated Fast CI handoff evidence is missing.'
          }
          New-Item -ItemType Directory -Force e2e-artifacts/reports | Out-Null
          Copy-Item -LiteralPath $source -Destination e2e-artifacts/reports/fast-ci-handoff.json -Force

      - name: Publish sanitized environment image evidence
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force e2e-artifacts/reports | Out-Null
          $digest = if ($env:ANKI_E2E_IMAGE_DIGEST) { $env:ANKI_E2E_IMAGE_DIGEST } else { $null }
          $contract = if ($env:ANKI_E2E_ENVIRONMENT_CONTRACT_SHA256) { $env:ANKI_E2E_ENVIRONMENT_CONTRACT_SHA256 } else { $null }
          $publicationRun = if ($env:ANKI_E2E_ENVIRONMENT_PUBLICATION_RUN_ID) { [long]$env:ANKI_E2E_ENVIRONMENT_PUBLICATION_RUN_ID } else { $null }
          $reuseRun = if ($env:ANKI_E2E_ENVIRONMENT_REUSE_VERIFICATION_RUN_ID) { [long]$env:ANKI_E2E_ENVIRONMENT_REUSE_VERIFICATION_RUN_ID } else { $null }
          $evidence = [ordered]@{
            schemaVersion = 1
            imageSource = $env:ANKI_E2E_IMAGE_SOURCE
            imageReference = $env:ANKI_E2E_IMAGE_REFERENCE
            imageDigest = $digest
            imagePlatform = $env:ANKI_E2E_IMAGE_PLATFORM
            imagePreparationDurationMs = [long]$env:ANKI_E2E_IMAGE_PREPARATION_DURATION_MS
            imageSizeBytes = [long]$env:ANKI_E2E_IMAGE_SIZE_BYTES
            environmentContractSha256 = $contract
            environmentPublicationRunId = $publicationRun
            environmentReuseVerificationRunId = $reuseRun
            cacheState = $env:ANKI_E2E_CACHE_STATE
            workflowSourceSha = $env:E2E_WORKFLOW_SOURCE_SHA
            e2eCheckoutSha = $env:E2E_CHECKOUT_SHA
            packageSource = $env:ANKI_E2E_PACKAGE_SOURCE
            sourceFastCiRunId = if ($env:ANKI_E2E_FAST_CI_RUN_ID) { [long]$env:ANKI_E2E_FAST_CI_RUN_ID } else { $null }
            sourceFastCiTestedSha = if ($env:ANKI_E2E_FAST_CI_TESTED_SHA) { $env:ANKI_E2E_FAST_CI_TESTED_SHA } else { $null }
            sourcePackageSha256 = if ($env:ANKI_E2E_FAST_CI_PACKAGE_SHA256) { $env:ANKI_E2E_FAST_CI_PACKAGE_SHA256 } else { $null }
          }
          $evidence | ConvertTo-Json -Depth 5 | Set-Content e2e-artifacts/reports/environment-image-provenance.json -Encoding utf8NoBOM
          @(
            '## E2E environment image'
            ''
            '| Field | Value |'
            '| --- | --- |'
            "| Source | $($evidence.imageSource) |"
            "| Reference | $($evidence.imageReference) |"
            "| Digest | $(if ($evidence.imageDigest) { $evidence.imageDigest } else { 'n/a' }) |"
            "| Platform | $($evidence.imagePlatform) |"
            "| Preparation | $($evidence.imagePreparationDurationMs) ms |"
            "| Image size | $($evidence.imageSizeBytes) bytes |"
            "| Cache state | $($evidence.cacheState) |"
          ) | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Capture final Docker state
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          "--- docker compose ps ---" | Tee-Object -FilePath ci-e2e-raw/docker-system.txt -Append
          if ($env:ANKI_E2E_IMAGE) {
            $arguments = @(
              'compose',
              '-f', 'docker/anki-e2e/docker-compose.yml',
              '-f', 'docker/anki-e2e/docker-compose.ghcr.yml',
              'ps', '-a'
            )
            & docker @arguments *>&1 | Tee-Object -FilePath ci-e2e-raw/docker-system.txt -Append
          } else {
            'Skipped: exact GHCR image identity was not exposed before failure.' |
              Tee-Object -FilePath ci-e2e-raw/docker-system.txt -Append
          }
          "--- disk after ---" | Tee-Object -FilePath ci-e2e-raw/docker-system.txt -Append
          df -h | Tee-Object -FilePath ci-e2e-raw/docker-system.txt -Append

      - name: Finalize Docker E2E state before artifact preparation
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $started = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $status = 'success'
          try {
            if ($env:ANKI_E2E_IMAGE) {
              $arguments = @(
                'compose',
                '--project-name', $env:COMPOSE_PROJECT_NAME,
                '-f', 'docker/anki-e2e/docker-compose.yml',
                '-f', 'docker/anki-e2e/docker-compose.ghcr.yml',
                'down', '-v', '--remove-orphans'
              )
              & docker @arguments
              if ($LASTEXITCODE -ne 0) { throw 'Docker E2E cleanup failed.' }
            } else {
              Write-Host 'Skipping Docker E2E cleanup because exact GHCR image identity was not exposed.'
              $status = 'skipped'
            }
          } catch {
            $status = 'failure'
            Write-Error $_ -ErrorAction Continue
          }
          $duration = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() - $started
          "E2E_FINAL_CLEANUP_STATUS=$status" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "E2E_FINAL_CLEANUP_DURATION_MS=$duration" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build canonical final E2E summary
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $hostFailure = @('--host-failure-code', 'ASR-E2E-SETUP', '--host-failure-phase', 'workflow-setup', '--host-failure-mode', 'fallback')
          if ($env:E2E_FINAL_CLEANUP_STATUS -eq 'failure') {
            $hostFailure = @('--host-failure-code', 'ASR-E2E-CLEANUP', '--host-failure-phase', 'host-cleanup', '--host-failure-mode', 'override')
          }
          $resourceTelemetry = if ($env:ANKI_E2E_RESOURCE_TELEMETRY -eq '1') { '--resource-telemetry' } else { '--no-resource-telemetry' }
          $dockerClient = (& docker version --format '{{.Client.Version}}' 2>$null | Select-Object -First 1)
          $dockerServer = (& docker version --format '{{.Server.Version}}' 2>$null | Select-Object -First 1)
          $dockerCompose = (& docker compose version --short 2>$null | Select-Object -First 1)
          python scripts/e2e_final_summary.py build-summary `
            --artifact-root e2e-artifacts `
            --output e2e-artifacts/reports/final-run-summary.json `
            --repository '${{ github.repository }}' `
            --run-id $env:GITHUB_RUN_ID `
            --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --event $env:GITHUB_EVENT_NAME `
            --ref $env:GITHUB_REF `
            --trigger-sha $env:GITHUB_SHA `
            --workflow-source-sha $env:E2E_WORKFLOW_SOURCE_SHA `
            --harness-sha $env:E2E_CHECKOUT_SHA `
            --mode $env:E2E_MODE `
            --scope $env:ANKI_E2E_SCOPE `
            --run-purpose $env:E2E_RUN_PURPOSE `
            --screenshot-workers $env:ANKI_E2E_SCREENSHOT_WORKERS `
            $resourceTelemetry `
            --contour cloud `
            --started-at-utc $env:CI_E2E_STARTED_AT `
            --exit-code $env:CI_E2E_EXIT_CODE `
            --runner-os $env:RUNNER_OS `
            --runner-image "$env:ImageOS`:$env:ImageVersion" `
            --docker-client-version "$dockerClient" `
            --docker-server-version "$dockerServer" `
            --docker-compose-version "$dockerCompose" `
            --powershell-version $env:CI_E2E_PWSH_VERSION `
            --package-source $env:ANKI_E2E_PACKAGE_SOURCE `
            --cleanup-status $env:E2E_FINAL_CLEANUP_STATUS `
            --cleanup-duration-ms $env:E2E_FINAL_CLEANUP_DURATION_MS `
            --artifact-preparation-status unavailable `
            @hostFailure
          if ($LASTEXITCODE -ne 0) { throw 'Canonical final E2E summary generation failed.' }
          $manifestStatus = if ([int]$env:CI_E2E_EXIT_CODE -eq 0 -and $env:E2E_FINAL_CLEANUP_STATUS -ne 'failure') { 'success' } else { 'failed' }
          python docker/anki-e2e/write-artifact-manifest.py `
            --root e2e-artifacts `
            --status $manifestStatus `
            --anki-version $env:ANKI_VERSION
          if ($LASTEXITCODE -ne 0) { throw 'Final-summary-aware artifact manifest generation failed.' }

      - name: Prepare redacted public E2E artifact
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $artifactExit = 0
          $started = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          try {
            python scripts/prepare_ci_e2e_artifacts.py `
              --source e2e-artifacts `
              --output ci-e2e `
              --raw-logs ci-e2e-raw `
              --mode $env:E2E_MODE `
              --scope $env:ANKI_E2E_SCOPE `
              --screenshot-workers $env:ANKI_E2E_SCREENSHOT_WORKERS `
              --build-duration-ms $env:ANKI_E2E_BUILD_DURATION_MS `
              --image-size-bytes $env:ANKI_E2E_IMAGE_SIZE_BYTES `
              --cache-state $env:ANKI_E2E_CACHE_STATE `
              --e2e-exit-code $env:CI_E2E_EXIT_CODE `
              --started-at $env:CI_E2E_STARTED_AT `
              --commit-sha $env:GITHUB_SHA `
              --ref $env:GITHUB_REF `
              --package-source $env:ANKI_E2E_PACKAGE_SOURCE `
              --source-fast-ci-run-id "$env:ANKI_E2E_FAST_CI_RUN_ID" `
              --source-fast-ci-tested-sha "$env:ANKI_E2E_FAST_CI_TESTED_SHA" `
              --source-package-sha256 "$env:ANKI_E2E_FAST_CI_PACKAGE_SHA256" `
              --e2e-checkout-sha $env:E2E_CHECKOUT_SHA
            if ($LASTEXITCODE -ne 0) { throw "Artifact preparation exited with $LASTEXITCODE" }
            if ($env:ANKI_E2E_PACKAGE_SOURCE -eq 'fast-ci-artifact') {
              python scripts/non_release_build_identity.py validate-pair `
                --raw e2e-artifacts/reports/non-release-build-identity.json `
                --public ci-e2e/artifacts/reports/non-release-build-identity.json
              if ($LASTEXITCODE -ne 0) { throw 'Public non-release build identity validation failed.' }
            } elseif ($env:ANKI_E2E_PACKAGE_SOURCE -eq 'release-artifact') {
              if (Test-Path -LiteralPath ci-e2e/artifacts/reports/non-release-build-identity.json -PathType Leaf) {
                throw 'Release E2E must not emit non-release build identity evidence.'
              }
              $rawRelease = 'e2e-artifacts/reports/release-build-identity.json'
              $publicRelease = 'ci-e2e/artifacts/reports/release-build-identity.json'
              if (-not (Test-Path -LiteralPath $rawRelease -PathType Leaf) -or -not (Test-Path -LiteralPath $publicRelease -PathType Leaf)) {
                throw 'Release E2E identity evidence is missing from raw or public artifacts.'
              }
              $rawIdentity = Get-Content -LiteralPath $rawRelease -Raw | ConvertFrom-Json
              $publicIdentity = Get-Content -LiteralPath $publicRelease -Raw | ConvertFrom-Json
              $expectedIdentity = "sha256:$env:RELEASE_ARTIFACT_SHA256_INPUT"
              if ($rawIdentity.identityDigest -ne $expectedIdentity -or $publicIdentity.identityDigest -ne $expectedIdentity) {
                throw 'Release E2E identity evidence differs from the validated package digest.'
              }
            }
          } catch {
            $artifactExit = 1
            Write-Error $_ -ErrorAction Continue
          }
          $duration = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() - $started
          "E2E_ARTIFACT_PREPARATION_DURATION_MS=$duration" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CI_E2E_ARTIFACT_EXIT_CODE=$artifactExit" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Finalize public canonical summary and legacy projections
        id: final_summary
        if: ${{ !cancelled() && env.CI_E2E_ARTIFACT_EXIT_CODE == '0' }}
        shell: pwsh
        run: |
          $finalizeExit = 0
          $hostFailure = @('--host-failure-code', 'ASR-E2E-SETUP', '--host-failure-phase', 'workflow-setup', '--host-failure-mode', 'fallback')
          if ($env:E2E_FINAL_CLEANUP_STATUS -eq 'failure') {
            $hostFailure = @('--host-failure-code', 'ASR-E2E-CLEANUP', '--host-failure-phase', 'host-cleanup', '--host-failure-mode', 'override')
          }
          try {
            $resourceTelemetry = if ($env:ANKI_E2E_RESOURCE_TELEMETRY -eq '1') { '--resource-telemetry' } else { '--no-resource-telemetry' }
            $dockerClient = (& docker version --format '{{.Client.Version}}' 2>$null | Select-Object -First 1)
            $dockerServer = (& docker version --format '{{.Server.Version}}' 2>$null | Select-Object -First 1)
            $dockerCompose = (& docker compose version --short 2>$null | Select-Object -First 1)
            python scripts/e2e_final_summary.py finalize-public `
              --artifact-root e2e-artifacts `
              --public-root ci-e2e `
              --output e2e-artifacts/reports/final-run-summary.json `
              --repository '${{ github.repository }}' `
              --run-id $env:GITHUB_RUN_ID `
              --run-attempt $env:GITHUB_RUN_ATTEMPT `
              --event $env:GITHUB_EVENT_NAME `
              --ref $env:GITHUB_REF `
              --trigger-sha $env:GITHUB_SHA `
              --workflow-source-sha $env:E2E_WORKFLOW_SOURCE_SHA `
              --harness-sha $env:E2E_CHECKOUT_SHA `
              --mode $env:E2E_MODE `
              --scope $env:ANKI_E2E_SCOPE `
              --run-purpose $env:E2E_RUN_PURPOSE `
              --screenshot-workers $env:ANKI_E2E_SCREENSHOT_WORKERS `
              $resourceTelemetry `
              --contour cloud `
              --started-at-utc $env:CI_E2E_STARTED_AT `
              --exit-code $env:CI_E2E_EXIT_CODE `
              --runner-os $env:RUNNER_OS `
              --runner-image "$env:ImageOS`:$env:ImageVersion" `
              --docker-client-version "$dockerClient" `
              --docker-server-version "$dockerServer" `
              --docker-compose-version "$dockerCompose" `
              --powershell-version $env:CI_E2E_PWSH_VERSION `
              --package-source $env:ANKI_E2E_PACKAGE_SOURCE `
              --artifact-preparation-duration-ms $env:E2E_ARTIFACT_PREPARATION_DURATION_MS `
              --cleanup-status $env:E2E_FINAL_CLEANUP_STATUS `
              --cleanup-duration-ms $env:E2E_FINAL_CLEANUP_DURATION_MS `
              --artifact-preparation-status success `
              --public-validated `
              @hostFailure
            if ($LASTEXITCODE -ne 0) { throw 'Canonical public finalization failed.' }
            python scripts/e2e_final_summary.py validate-pair `
              --raw e2e-artifacts/reports/final-run-summary.json `
              --public ci-e2e/artifacts/reports/final-run-summary.json
            if ($LASTEXITCODE -ne 0) { throw 'Raw/public final summary validation failed.' }
          } catch {
            $finalizeExit = 1
            Write-Error $_ -ErrorAction Continue
          }
          "CI_E2E_ARTIFACT_EXIT_CODE=$finalizeExit" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          if ($finalizeExit -ne 0) { throw 'Canonical public finalization failed.' }

      - name: Start artifact upload timing
        if: ${{ !cancelled() && steps.final_summary.outcome == 'success' && env.CI_E2E_ARTIFACT_EXIT_CODE == '0' }}
        shell: pwsh
        run: |
          "ARTIFACT_UPLOAD_STARTED_MS=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload E2E artifact
        id: artifact_upload
        if: ${{ !cancelled() && steps.final_summary.outcome == 'success' && env.CI_E2E_ARTIFACT_EXIT_CODE == '0' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-e2e-${{ env.E2E_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-e2e/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Resolve uploaded E2E artifact metadata
        id: main_artifact_metadata
        if: ${{ !cancelled() && steps.artifact_upload.outcome == 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact_upload.outputs.artifact-id }}
        run: |
          $duration = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() - [long]$env:ARTIFACT_UPLOAD_STARTED_MS
          "E2E_ARTIFACT_UPLOAD_DURATION_MS=$duration" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $metadata = Join-Path $env:RUNNER_TEMP 'main-artifact-api.json'
          gh api "repos/${{ github.repository }}/actions/artifacts/$env:ARTIFACT_ID" | Set-Content -LiteralPath $metadata -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve uploaded E2E artifact metadata.' }
          python scripts/e2e_history_transport.py metadata `
            --input $metadata `
            --expected-id $env:ARTIFACT_ID `
            --repository-id '${{ github.repository_id }}' `
            --current-run-id $env:GITHUB_RUN_ID `
            --output "$env:RUNNER_TEMP/main-artifact-metadata.json" `
            --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'Uploaded E2E artifact metadata validation failed.' }

      - name: Discover previous bounded E2E history
        id: previous_history
        if: ${{ !cancelled() && steps.artifact_upload.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pages = Join-Path $env:RUNNER_TEMP 'history-artifact-pages.json'
          $listing = Join-Path $env:RUNNER_TEMP 'history-artifacts.json'
          gh api --paginate --slurp "repos/${{ github.repository }}/actions/artifacts?per_page=100" | Set-Content -LiteralPath $pages -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw 'Could not list previous E2E history artifacts.' }
          $pagePayload = Get-Content -LiteralPath $pages -Raw | ConvertFrom-Json
          $artifacts = @($pagePayload | ForEach-Object { @($_.artifacts) })
          [ordered]@{ total_count = $artifacts.Count; artifacts = $artifacts } |
            ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $listing -Encoding utf8NoBOM
          python scripts/e2e_history_transport.py select `
            --input $listing `
            --repository-id '${{ github.repository_id }}' `
            --current-run-id $env:GITHUB_RUN_ID `
            --output "$env:RUNNER_TEMP/history-selection.json" `
            --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'Previous E2E history selection failed.' }

      - name: Download previous bounded E2E history
        if: ${{ !cancelled() && steps.previous_history.outputs.status == 'selected' }}
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.previous_history.outputs.artifact_id }}
          path: ${{ runner.temp }}/previous-e2e-history
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous_history.outputs.source_run_id }}
          merge-multiple: true
          digest-mismatch: error

      - name: Build compact bounded E2E history
        if: ${{ !cancelled() && steps.artifact_upload.outcome == 'success' }}
        shell: pwsh
        run: |
          Write-Host 'history continuity: append when valid; bootstrap or reset otherwise'
          $reports = 'ci-e2e-history/reports'
          New-Item -ItemType Directory -Force $reports | Out-Null
          Copy-Item ci-e2e/artifacts/reports/final-run-summary.json "$reports/final-run-summary.json" -Force
          python scripts/e2e_final_summary.py build-entry `
            --summary "$reports/final-run-summary.json" `
            --output "$env:RUNNER_TEMP/current-history-entry.json" `
            --main-artifact-id '${{ steps.main_artifact_metadata.outputs.artifact_id }}' `
            --main-artifact-digest '${{ steps.main_artifact_metadata.outputs.artifact_digest }}' `
            --main-artifact-size-bytes '${{ steps.main_artifact_metadata.outputs.artifact_size_bytes }}' `
            --main-artifact-expires-at-utc '${{ steps.main_artifact_metadata.outputs.artifact_expires_at_utc }}' `
            --artifact-upload-duration-ms $env:E2E_ARTIFACT_UPLOAD_DURATION_MS
          if ($LASTEXITCODE -ne 0) { throw 'Current E2E history entry generation failed.' }
          $previous = "$env:RUNNER_TEMP/previous-e2e-history/reports/e2e-run-history.json"
          $mergeArgs = @()
          if (Test-Path -LiteralPath $previous -PathType Leaf) {
            $mergeArgs = @('--previous', $previous)
          } else {
            $mergeArgs = @('--reset-reason', 'bootstrap: previous history is missing, expired, unavailable, or corrupt')
          }
          python scripts/e2e_final_summary.py merge-history `
            @mergeArgs `
            --entry "$env:RUNNER_TEMP/current-history-entry.json" `
            --output "$reports/e2e-run-history.json"
          if ($LASTEXITCODE -ne 0) { throw 'Bounded E2E history merge failed.' }
          python scripts/e2e_final_summary.py aggregate-history `
            --history "$reports/e2e-run-history.json" `
            --summary "$reports/final-run-summary.json" `
            --output "$reports/e2e-history-aggregation.json"
          if ($LASTEXITCODE -ne 0) { throw 'E2E history aggregation failed.' }
          python scripts/e2e_final_summary.py render-observations `
            --history "$reports/e2e-run-history.json" `
            --summary "$reports/final-run-summary.json" `
            --aggregation "$reports/e2e-history-aggregation.json" `
            --json-output "$reports/e2e-regression-observations.json" `
            --markdown-output "$reports/e2e-regression-observations.md"
          if ($LASTEXITCODE -ne 0) { throw 'Observational E2E comparison rendering failed.' }
          $allowed = @(
            'reports/final-run-summary.json',
            'reports/e2e-run-history.json',
            'reports/e2e-history-aggregation.json',
            'reports/e2e-regression-observations.json',
            'reports/e2e-regression-observations.md'
          )
          $actual = @(Get-ChildItem ci-e2e-history -File -Recurse | ForEach-Object { $_.FullName.Substring((Resolve-Path ci-e2e-history).Path.Length + 1).Replace('\\', '/') } | Sort-Object)
          if (Compare-Object ($allowed | Sort-Object) $actual) { throw 'Compact history artifact differs from its explicit allowlist.' }

      - name: Upload compact E2E history artifact
        id: history_artifact_upload
        if: ${{ !cancelled() && steps.artifact_upload.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-e2e-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-e2e-history/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Resolve compact history artifact metadata
        id: history_artifact_metadata
        if: ${{ !cancelled() && steps.history_artifact_upload.outcome == 'success' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.history_artifact_upload.outputs.artifact-id }}
        run: |
          $metadata = Join-Path $env:RUNNER_TEMP 'history-artifact-api.json'
          gh api "repos/${{ github.repository }}/actions/artifacts/$env:ARTIFACT_ID" | Set-Content -LiteralPath $metadata -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve compact history artifact metadata.' }
          python scripts/e2e_history_transport.py metadata `
            --input $metadata `
            --expected-id $env:ARTIFACT_ID `
            --repository-id '${{ github.repository_id }}' `
            --current-run-id $env:GITHUB_RUN_ID `
            --output "$env:RUNNER_TEMP/history-artifact-metadata.json" `
            --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'Compact history artifact metadata validation failed.' }

      - name: Render compact canonical E2E Step Summary
        if: ${{ !cancelled() && steps.artifact_upload.outcome == 'success' }}
        shell: pwsh
        run: |
          python scripts/e2e_final_summary.py render-github-summary `
            --summary ci-e2e-history/reports/final-run-summary.json `
            --aggregation ci-e2e-history/reports/e2e-history-aggregation.json `
            --history ci-e2e-history/reports/e2e-run-history.json `
            --main-artifact-metadata "$env:RUNNER_TEMP/main-artifact-metadata.json" `
            --history-artifact-metadata "$env:RUNNER_TEMP/history-artifact-metadata.json" `
            --output "$env:RUNNER_TEMP/e2e-final-step-summary.md"
          if ($LASTEXITCODE -ne 0) { throw 'Compact E2E Step Summary rendering failed.' }
          Get-Content "$env:RUNNER_TEMP/e2e-final-step-summary.md" | Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Clean cancelled Docker E2E state
        if: ${{ cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: |
          $started = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $hostLog = Join-Path $env:RUNNER_TEMP 'e2e-cancellation-host.log'
          Remove-Item -LiteralPath $hostLog -Force -ErrorAction SilentlyContinue
          $arguments = @(
            '30s', 'docker', 'compose',
            '--project-name', $env:COMPOSE_PROJECT_NAME,
            '-f', 'docker/anki-e2e/docker-compose.yml',
            '-f', 'docker/anki-e2e/docker-compose.ghcr.yml',
            'down', '-v', '--remove-orphans'
          )
          & /usr/bin/timeout @arguments *>&1 | Tee-Object -FilePath $hostLog
          $cleanupExit = [int]$LASTEXITCODE
          $cleanupStatus = if ($cleanupExit -eq 0) { 'success' } else { 'failure' }
          $cleanupDuration = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds() - $started
          "E2E_FINAL_CLEANUP_STATUS=$cleanupStatus" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "E2E_FINAL_CLEANUP_DURATION_MS=$cleanupDuration" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          if ($cleanupExit -ne 0) { Write-Warning "Bounded cancellation cleanup exited with $cleanupExit." }

          $uid = (& id -u).Trim()
          $gid = (& id -g).Trim()
          if ($uid -match '^\d+$' -and $gid -match '^\d+$') {
            $owner = "${uid}:${gid}"
            & /usr/bin/timeout 10s sudo chown -R -- $owner e2e-artifacts
            $ownershipExit = [int]$LASTEXITCODE
            if ($ownershipExit -ne 0) { Write-Warning "Cancellation artifact ownership restoration exited with $ownershipExit." }
          } else {
            Write-Warning 'Could not resolve the hosted-runner UID/GID for cancellation evidence.'
          }

          New-Item -ItemType Directory -Force e2e-artifacts/diagnostics, e2e-artifacts/reports | Out-Null
          if (Test-Path -LiteralPath $hostLog -PathType Leaf) {
            Copy-Item -LiteralPath $hostLog -Destination e2e-artifacts/diagnostics/cancellation-host.log -Force
          }
          $stagedIdentity = 'ci-e2e-raw/non-release-build-identity.json'
          if (Test-Path -LiteralPath $stagedIdentity -PathType Leaf) {
            Copy-Item -LiteralPath $stagedIdentity -Destination e2e-artifacts/reports/non-release-build-identity.json -Force
          }

      - name: Build bounded cancellation final summary
        if: ${{ cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: |
          $resourceTelemetry = if ($env:ANKI_E2E_RESOURCE_TELEMETRY -eq '1') { '--resource-telemetry' } else { '--no-resource-telemetry' }
          $cancellation = Get-Content e2e-artifacts/reports/cancellation-summary.json -Raw | ConvertFrom-Json
          $cancellationExit = if ([int]$cancellation.originalExitCode -in @(130, 143)) { [int]$cancellation.originalExitCode } else { 143 }
          python scripts/e2e_final_summary.py build-summary `
            --artifact-root e2e-artifacts `
            --output e2e-artifacts/reports/final-run-summary.json `
            --repository '${{ github.repository }}' `
            --run-id $env:GITHUB_RUN_ID `
            --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --event $env:GITHUB_EVENT_NAME `
            --ref $env:GITHUB_REF `
            --trigger-sha $env:GITHUB_SHA `
            --workflow-source-sha $env:E2E_WORKFLOW_SOURCE_SHA `
            --harness-sha $env:E2E_CHECKOUT_SHA `
            --mode $env:E2E_MODE `
            --scope $env:ANKI_E2E_SCOPE `
            --run-purpose $env:E2E_RUN_PURPOSE `
            --screenshot-workers $env:ANKI_E2E_SCREENSHOT_WORKERS `
            $resourceTelemetry `
            --contour cloud `
            --started-at-utc $env:CI_E2E_STARTED_AT `
            --exit-code $cancellationExit `
            --runner-os $env:RUNNER_OS `
            --runner-image "$env:ImageOS`:$env:ImageVersion" `
            --powershell-version $env:CI_E2E_PWSH_VERSION `
            --package-source $env:ANKI_E2E_PACKAGE_SOURCE `
            --cleanup-status $env:E2E_FINAL_CLEANUP_STATUS `
            --cleanup-duration-ms $env:E2E_FINAL_CLEANUP_DURATION_MS `
            --artifact-preparation-status partial
          if ($LASTEXITCODE -ne 0) { Write-Warning 'Bounded cancellation final summary generation failed.' }

      - name: Prepare bounded cancellation artifact
        if: ${{ cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: |
          python scripts/prepare_ci_e2e_cancellation.py `
            --source e2e-artifacts `
            --output ci-e2e-cancelled
          if (Test-Path ci-e2e-cancelled/reports/cancellation-summary.json) {
            Write-Host 'Immutable cancellation-summary.json preserved.'
          }
          if (Test-Path ci-e2e-cancelled/reports/final-run-summary.json) {
            Write-Host 'Bounded final-run-summary.json added.'
          }

      - name: Upload bounded cancellation evidence
        if: ${{ cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-e2e-cancelled-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-e2e-cancelled/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload canonical preflight failure evidence
        if: ${{ !cancelled() && (steps.static_preflight.outcome == 'failure' || steps.runtime_preflight.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-e2e-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e-artifacts/reports/preflight-report.json
            e2e-artifacts/reports/final-run-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Restore canonical result
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $e2eExit = if ($env:CI_E2E_EXIT_CODE) { [int]$env:CI_E2E_EXIT_CODE } else { 1 }
          $artifactExit = if ($env:CI_E2E_ARTIFACT_EXIT_CODE) { [int]$env:CI_E2E_ARTIFACT_EXIT_CODE } else { 1 }
          $cleanupExit = if ($env:E2E_FINAL_CLEANUP_STATUS -eq 'failure') { 1 } else { 0 }
          if ($e2eExit -ne 0 -or $artifactExit -ne 0 -or $cleanupExit -ne 0) {
            throw "Full E2E failed (e2e=$e2eExit, artifact=$artifactExit, cleanup=$cleanupExit)."
          }
