name: Apply native night-mode correction documentation

on:
  pull_request:
    branches:
      - core
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'c2-manual-acceptance-remediation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: c2-manual-acceptance-remediation
          fetch-depth: 0

      - name: Apply verified documentation patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat .nightmode-docs-patch/chunk-* | base64 --decode > /tmp/nightmode-docs.patch.zst
          echo '3284a38fcae761a0874a15e1c28cc8eecd0c05b9457db57a7ba9ecd7456d2a3e  /tmp/nightmode-docs.patch.zst' | sha256sum --check --strict
          zstd --decompress --stdout /tmp/nightmode-docs.patch.zst > /tmp/nightmode-docs.patch
          echo '3ad911f4968b1e534d833666c7569d6b8bb2f2a4f0cf2e9ad4ff2449d12424c4  /tmp/nightmode-docs.patch' | sha256sum --check --strict
          git apply --index --whitespace=error /tmp/nightmode-docs.patch
          git rm -r .nightmode-docs-patch .github/workflows/nightmode-docs-apply.yml
          git commit -m 'Document native Anki night-mode correction evidence'
          git push origin HEAD:c2-manual-acceptance-remediation
