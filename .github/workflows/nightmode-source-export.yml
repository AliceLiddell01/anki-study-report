name: Export night-mode correction source

on:
  push:
    branches:
      - c2-manual-acceptance-remediation

permissions:
  contents: write

jobs:
  export:
    if: contains(github.event.head_commit.message, 'Export source for native Anki night-mode correction')
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: c2-manual-acceptance-remediation
          fetch-depth: 0

      - name: Export source snapshot
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nightmode-source.tar.zst"
          checksum="$RUNNER_TEMP/nightmode-source.sha256"
          tar \
            --exclude=.git \
            --exclude='web-dashboard/node_modules' \
            --exclude='web-dashboard/dist' \
            --exclude='**/coverage' \
            --exclude='**/test-results' \
            --exclude='**/playwright-report' \
            -C "$GITHUB_WORKSPACE" \
            -caf "$archive" .
          sha256sum "$archive" > "$checksum"

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: cards-nightmode-source
          path: |
            ${{ runner.temp }}/nightmode-source.tar.zst
            ${{ runner.temp }}/nightmode-source.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary exporter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/nightmode-source-export.yml
          git commit -m 'Remove the temporary night-mode source exporter'
          git push origin HEAD:c2-manual-acceptance-remediation
