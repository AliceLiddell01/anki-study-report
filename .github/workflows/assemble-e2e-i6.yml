name: Assemble E2E-I6 workflow payload

on:
  push:
    branches:
      - platform/e2e-i6-final-summary-history
    paths:
      - .github/e2e-i6/ci-e2e.xz.b64
      - .github/workflows/assemble-e2e-i6.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out staging branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Assemble and commit verified workflow payload
        shell: bash
        env:
          EXPECTED_SHA256: 85fce4bf0651886e39f941e63427cd4850965c46c096b1ab9b79c761e98c0aa2
          EXPECTED_BLOB_SHA: e77111f0089b1c823df5c7b75732897256f3e085
        run: |
          set -euo pipefail
          base64 --decode .github/e2e-i6/ci-e2e.xz.b64 | xz --decompress > ci-e2e.generated.yml
          test "$(sha256sum ci-e2e.generated.yml | cut -d' ' -f1)" = "$EXPECTED_SHA256"
          test "$(git hash-object ci-e2e.generated.yml)" = "$EXPECTED_BLOB_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci-e2e.generated.yml
          git commit -m "Stage generated E2E-I6 workflow"
          git push origin "HEAD:${GITHUB_REF_NAME}"
